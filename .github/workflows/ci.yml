name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # pnpm is provided by Corepack in the next step; setup-node v5's automatic
          # package-manager cache would otherwise look for pnpm before it exists.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --directory services/ai --locked
      - name: Pins (D-17 Q1)
        run: pnpm check:pins
      - name: Images / size guard (D-08 Q6)
        run: pnpm check:images
      - name: Guard script tests
        run: pnpm test:scripts
      - name: Env files ignored
        run: |
          touch .env .env.neon
          pnpm check:ignore
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests (Jest + pytest, incl. enum parity)
        run: pnpm test
      - name: Expo dependency alignment (D-17 Q6)
        run: pnpm --filter @janawaaz/mobile exec expo install --check

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact .

  # Enabled by I-02 (Prisma schema + migrations against a Postgres service container).
  prisma-migrate:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: echo "enabled in I-02"

  # Enabled by I-41 (Dockerfiles + pinned-digest checks).
  docker-build:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: echo "enabled in I-41"

# No EAS or Maestro jobs: EAS builds are manual only and never started by CI (D-17 Q4).
